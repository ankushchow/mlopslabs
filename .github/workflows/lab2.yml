name: Lab 2 - Train, calibrate, and version

on:
  push:
    branches: [main]
    paths: ['lab2/**', '.github/workflows/lab2.yml']
  pull_request:
    paths: ['lab2/**', '.github/workflows/lab2.yml']
  workflow_dispatch:
    inputs:
      min_f1:
        description: 'Minimum calibrated F1 (0 to 1). Use 1.0 to demonstrate rejection.'
        required: true
        default: '0.85'
        type: string

permissions:
  contents: read

concurrency:
  group: lab2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: lab2

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.14'
          cache: pip
          cache-dependency-path: lab2/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Test split isolation, quality rejection, and version integrity
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Preserve test evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab2-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: lab2/test-results.xml
          if-no-files-found: error
          retention-days: 30

  train-evaluate:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      MIN_F1: ${{ inputs.min_f1 || '0.85' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.14'
          cache: pip
          cache-dependency-path: lab2/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Version by UTC time, source commit, run ID, and attempt
        id: version
        run: |
          version="$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_SHA:0:7}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Train
        run: python -m src.train_model --version "$VERSION"
      - name: Calibrate on separate data
        run: python -m src.calibrate_model --version "$VERSION"
      - name: Evaluate and enforce quality gate
        run: python -m src.evaluate_model --version "$VERSION" --min-f1 "$MIN_F1"
      - name: Preserve metrics even when the quality gate fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab2-metrics-${{ github.run_id }}-${{ github.run_attempt }}
          path: lab2/artifacts/*/metrics.json
          if-no-files-found: warn
          retention-days: 30
      - name: Transfer approved model bundle to publication job
        uses: actions/upload-artifact@v4
        with:
          name: lab2-approved-${{ steps.version.outputs.version }}
          path: |
            lab2/artifacts/${{ steps.version.outputs.version }}/*.joblib
            lab2/artifacts/${{ steps.version.outputs.version }}/*.json
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: train-evaluate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lab2-approved-${{ needs.train-evaluate.outputs.version }}
          path: approved
      - name: Verify manifest and hashes before publication
        working-directory: approved
        run: |
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path('manifest.json').read_text())
          assert manifest['approved'] is True
          for name, expected in manifest['sha256'].items():
              assert hashlib.sha256(Path(name).read_bytes()).hexdigest() == expected, name
          print('Verified approved model bundle')
          PY
      - name: Publish versioned model
        uses: actions/upload-artifact@v4
        with:
          name: lab2-model-${{ needs.train-evaluate.outputs.version }}
          path: approved/
          if-no-files-found: error
          retention-days: 30
