name: Lab 2 - Train, calibrate, and version

on:
  push:
    branches: [main]
    paths: ['lab2/**', '.github/workflows/lab2.yml']
  pull_request:
    paths: ['lab2/**', '.github/workflows/lab2.yml']
  workflow_dispatch:
    inputs:
      min_f1:
        description: 'Minimum calibrated macro F1 (0 to 1). Use 1.0 to demonstrate rejection.'
        required: true
        default: '0.85'
        type: string

permissions:
  contents: read

concurrency:
  group: lab2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: lab2

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.14'
          cache: pip
          cache-dependency-path: lab2/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Test Wine data, model outputs, and quality gate
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Preserve test evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab2-tests-${{ github.run_id }}-${{ github.run_attempt }}
          path: lab2/test-results.xml
          if-no-files-found: error
          retention-days: 30

  train-evaluate:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ github.run_id }}-${{ github.run_attempt }}
      MIN_F1: ${{ inputs.min_f1 || '0.85' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.14'
          cache: pip
          cache-dependency-path: lab2/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Run all three experiments and enforce the quality gate
        run: python -m src.run_experiments --version "$VERSION" --min-f1 "$MIN_F1"
      - name: Preserve experiment descriptions, results, and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab2-experiments-${{ env.VERSION }}
          path: |
            lab2/artifacts/${{ env.VERSION }}/experiments.json
            lab2/artifacts/${{ env.VERSION }}/*.log
            lab2/artifacts/${{ env.VERSION }}/**/experiment.json
            lab2/artifacts/${{ env.VERSION }}/**/metrics.json
          if-no-files-found: warn
          retention-days: 30
      - name: Publish models after all three experiments pass
        if: success() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: lab2-models-${{ env.VERSION }}
          path: |
            lab2/artifacts/${{ env.VERSION }}/**/*.joblib
            lab2/artifacts/${{ env.VERSION }}/**/training.json
            lab2/artifacts/${{ env.VERSION }}/**/experiment.json
            lab2/artifacts/${{ env.VERSION }}/**/metrics.json
            lab2/artifacts/${{ env.VERSION }}/experiments.json
          if-no-files-found: error
          retention-days: 30
