name: Lab 4 - Validate MLflow tracking

on:
  push:
    branches: [main]
    paths: ['lab4/**', '.github/workflows/lab4.yml']
  pull_request:
    paths: ['lab4/**', '.github/workflows/lab4.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lab4-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: lab4

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.14'
          cache: pip
          cache-dependency-path: lab4/requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python -m pytest -q --junitxml=test-results.xml
      - run: python -m src.run_experiments --batch ci-comparison
      - run: python -m src.predict --summary outputs/ci-comparison/experiments.json --input outputs/ci-comparison/sample_input.csv --output outputs/ci-comparison/reloaded_predictions.csv
      - name: Preserve test reports and experiment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab4-mlflow-validation
          path: |
            lab4/test-results.xml
            lab4/outputs/ci-comparison/
          if-no-files-found: warn
          retention-days: 30
